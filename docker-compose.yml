services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      FUSEKI_QUERY_URL: http://fuseki:3030/energyhome/query
    depends_on:
      - fuseki
    restart: unless-stopped

  fuseki:
    image: stain/jena-fuseki:latest
    container_name: energyhome-fuseki
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: admin
    volumes:
      - fuseki-data:/fuseki
    restart: unless-stopped

volumes:
  fuseki-data:
